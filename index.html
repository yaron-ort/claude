<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הפרויקטים של ירון</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: "Assistant", system-ui, sans-serif; background: #fbf6ea; color: #2b2a33; }
  main { max-width: 760px; margin: 0 auto; padding: 60px 22px; }
  h1 { font-size: 44px; margin: 0 0 8px; }
  p.lead { color: #5d5a66; font-size: 19px; margin: 0 0 34px; }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  a.tile { display: block; text-decoration: none; color: inherit; background: #fff; border: 1px solid #e6dcc3;
    border-radius: 18px; padding: 24px; transition: transform .15s, box-shadow .15s; }
  a.tile:hover { transform: translateY(-3px); box-shadow: 0 12px 26px -14px rgba(0,0,0,.35); }
  .tile .ico { font-size: 34px; }
  .tile h2 { margin: 8px 0 4px; font-size: 24px; }
  .tile p { margin: 0; color: #5d5a66; }
</style>
</head>
<body>
<main>
  <h1>הפרויקטים של ירון</h1>
  <p class="lead">כל פרויקט בתיקייה משלו.</p>
  <div class="grid">
    <a class="tile" href="books/"><div class="ico">📚</div><h2>פירות העט</h2><p>חמשת הספרים שלי: הורדה חינם ועותקים מודפסים.</p></a>
    <a class="tile" href="singing-games/"><div class="ico">🎤</div><h2>Pitch Glider</h2><p>משחקי שירה ואימון שמיעה: Pitch Glider, Pitch Pal ו־Walk and Sing.</p></a>
  </div>
</main>
</body>
</html>
